plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.bokharest.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.bokharest.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def store = file('release.jks')
            if (!store.exists()) {
                store = file('app/release.jks')
            }
            if (store.exists()) {
                storeFile store
                storePassword "bokharest2026"
                keyAlias "bokharest"
                keyPassword "bokharest2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Import the Firebase BoM (Bill of Materials) for automatic version alignment
    implementation platform('com.google.firebase:firebase-bom:33.7.0')

    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'

    // Cloud Firestore
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Analytics (Recommended when using Google Services)
    implementation 'com.google.firebase:firebase-analytics'

    // Standard AndroidX & Material Design libraries
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
