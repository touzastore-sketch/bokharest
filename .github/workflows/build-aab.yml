name: Build and Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🌐 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Web Dependencies & Build Production Web App
        run: |
          npm install
          npm run build

      - name: 📂 Sync Web Build Assets into Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: 🔑 Generate Keystore & Build Release AAB
        working-directory: ./android
        run: |
          keytool -genkey -v -keystore release.jks -alias bokharest -keyalg RSA -keysize 2048 -validity 10000 -storepass bokharest2026 -keypass bokharest2026 -dname "CN=Bokharest, OU=App, O=BokharestBlack, L=PortSaid, C=EG"
          gradle bundleRelease -PRELEASE_STORE_FILE=release.jks -PRELEASE_STORE_PASSWORD=bokharest2026 -PRELEASE_KEY_ALIAS=bokharest -PRELEASE_KEY_PASSWORD=bokharest2026 || gradle bundleDebug

      - name: 📤 Upload AAB for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Bokharest-Black-AppBundle-aab
          path: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
