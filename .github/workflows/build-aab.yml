name: Build and Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🌐 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Web Dependencies & Build Production Web App
        run: |
          npm install
          npm run build

      - name: 📂 Sync Web Build Assets into Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: 🔑 Prepare Keystore Files
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding original keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks
            cp app/release.jks release.jks
          else
            echo "Generating Fallback Keystore..."
            keytool -genkey -v -keystore app/release.jks -alias bokharest -keyalg RSA -keysize 2048 -validity 10000 -storepass bokharest2026 -keypass bokharest2026 -dname "CN=Bokharest, OU=App, O=BokharestBlack, L=PortSaid, C=EG"
            cp app/release.jks release.jks
          fi

      - name: 🐘 Build Release AAB
        working-directory: ./android
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'bokharest2026' }}
          KEY_AL: ${{ secrets.KEY_ALIAS || 'bokharest' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'bokharest2026' }}
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_AL" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS" \
            --stacktrace

      - name: 📤 Upload AAB for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Bokharest-Black-AppBundle-aab
          path: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
