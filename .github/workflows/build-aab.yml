name: Build and Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 🌐 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Web Dependencies & Build Production Web App
        run: |
          npm install
          npm run build

      - name: 📂 Sync Web Build Assets into Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: 🔑 Prepare Keystore Files
        working-directory: ./android
        run: |
          echo "Generating Clean Release Keystore..."
          mkdir -p app
          keytool -genkey -v -keystore app/release.jks -alias bokharest -keyalg RSA -keysize 2048 -validity 10000 -storepass bokharest2026 -keypass bokharest2026 -dname "CN=Bokharest, OU=App, O=BokharestBlack, L=PortSaid, C=EG"
          cp app/release.jks release.jks

      - name: 🐘 Build Release AAB & APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: 📤 Upload AAB for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Bokharest-Black-v2.0.0-AAB-and-APK
          path: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
