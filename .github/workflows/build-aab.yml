name: Build and Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 🌐 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Web Dependencies & Build Production Web App
        run: |
          npm install
          npm run build

      - name: 📂 Sync Web Build Assets into Android App
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: 🔑 Prepare Keystore & Export PEM Certificate
        working-directory: ./android
        run: |
          mkdir -p app
          if [ -f "app/release.jks" ]; then
            echo "Using existing permanent release.jks..."
            cp app/release.jks release.jks
          elif [ -f "release.jks" ]; then
            echo "Using release.jks in root..."
            cp release.jks app/release.jks
          else
            echo "Generating Clean Release Keystore..."
            keytool -genkey -v -keystore app/release.jks -alias bokharest -keyalg RSA -keysize 2048 -validity 10000 -storepass bokharest2026 -keypass bokharest2026 -dname "CN=Bokharest, OU=App, O=BokharestBlack, L=PortSaid, C=EG"
            cp app/release.jks release.jks
          fi
          echo "Exporting PEM certificate for Google Play..."
          keytool -export -rfc -keystore app/release.jks -alias bokharest -file upload_certificate.pem -storepass bokharest2026
          cp upload_certificate.pem ../upload_certificate.pem

      - name: 🐘 Build Release AAB & APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: 📜 Upload PEM Certificate (Google Play Upload Key Reset)
        uses: actions/upload-artifact@v4
        with:
          name: Bokharest-Black-Upload-Certificate-PEM
          path: android/upload_certificate.pem
          retention-days: 30

      - name: 📱 Upload APK (Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: Bokharest-Black-v2.0.1-APK-Installable
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Bokharest-Black-v2.0.1-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
